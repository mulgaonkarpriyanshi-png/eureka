<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eureka Trips — Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script src="typography-engine.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Poppins',sans-serif;background:#f4f6f5;color:#3A3B3B;font-weight:400}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:inherit;border:none;outline:none}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#02A9A2;border-radius:2px}

:root{
  --teal:#02A9A2; --teal-d:#027A74; --teal-l:#e8f8f4;
  --coral:#E76F51; --dark:#3A3B3B; --body:#6B7575;
  --cream:#f7f7f5; --cream2:#eef5f3; --white:#ffffff;
  --border:rgba(58,59,59,0.10); --border2:rgba(58,59,59,0.18);
  --red:#c0392b; --red2:#fadbd8; --green2:#d5f5e3;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 12px 48px rgba(0,0,0,.12);
  --r:12px; --head:'Playfair Display',Georgia,serif;
}

.app{display:flex;height:100vh;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{width:255px;flex-shrink:0;background:var(--dark);display:flex;flex-direction:column;overflow-y:auto;z-index:10}
.sidebar-logo{padding:1.75rem 1.5rem 1.25rem;border-bottom:1px solid rgba(255,255,255,0.08)}
.sidebar-logo-name{font-family:var(--head);font-size:21px;font-weight:700;color:white}
.sidebar-logo-sub{font-size:9px;color:rgba(255,255,255,0.3);letter-spacing:3px;text-transform:uppercase;margin-top:3px}
.sidebar-badge{margin:1rem 1.5rem;background:rgba(2,169,162,0.15);border:1px solid rgba(2,169,162,0.3);border-radius:6px;padding:8px 12px;font-size:11px;color:#5eead4;display:flex;align-items:center;gap:8px}
.sidebar-badge-dot{width:6px;height:6px;border-radius:50%;background:var(--teal);flex-shrink:0;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.sidebar-nav{flex:1;padding:0.5rem 0}
.nav-section{padding:1.1rem 1.5rem 0.4rem;font-size:9.5px;color:#f4a261;letter-spacing:2px;text-transform:uppercase;font-weight:700;display:flex;align-items:center;gap:6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:0.6rem 1.5rem 0.6rem 2rem;font-size:12.5px;color:rgba(255,255,255,0.55);cursor:pointer;transition:all 0.2s;border-left:2px solid transparent;font-weight:400}
.nav-item:hover{color:rgba(255,255,255,0.9);background:rgba(255,255,255,0.04)}
.nav-item.active{color:white;background:rgba(255,255,255,0.07);border-left-color:var(--coral)}
.nav-item.sub{padding-left:2.75rem;font-size:11.5px;color:rgba(255,255,255,0.4)}
.nav-icon{font-size:13px;width:16px;text-align:center;flex-shrink:0}
.sidebar-footer{padding:1.25rem 1.5rem;border-top:1px solid rgba(255,255,255,0.08)}
.sidebar-footer a{font-size:12px;color:rgba(255,255,255,0.3);display:flex;align-items:center;gap:8px;transition:color 0.2s}
.sidebar-footer a:hover{color:rgba(255,255,255,0.6)}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:60px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 2rem;flex-shrink:0}
.topbar-title-wrap{display:flex;flex-direction:column;justify-content:center}
.topbar-title{font-family:var(--head);font-size:20px;font-weight:700;color:var(--dark);line-height:1.2}
.topbar-crumb{font-size:10.5px;color:var(--teal-d);letter-spacing:0.4px;text-transform:uppercase;font-weight:600}
.topbar-right{display:flex;align-items:center;gap:12px}
.btn-add{background:var(--teal);color:white;padding:9px 20px;border-radius:30px;font-size:12px;font-weight:600;letter-spacing:0.5px;transition:all 0.2s;display:flex;align-items:center;gap:7px}
.btn-add:hover{background:var(--teal-d)}
.content{flex:1;overflow-y:auto;padding:2rem}
.page-hint{background:var(--teal-l);border:1px solid rgba(2,169,162,.25);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--teal-d);margin-bottom:1.25rem;display:flex;gap:8px;align-items:flex-start}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;right:24px;z-index:9999;background:var(--dark);color:white;padding:12px 20px;border-radius:8px;font-size:13px;box-shadow:var(--shadow-md);transform:translateY(80px);opacity:0;transition:all 0.35s ease;display:flex;align-items:center;gap:10px;max-width:320px}
.toast.show{transform:translateY(0);opacity:1}
.toast.error{background:var(--red)}
.toast.success{background:var(--teal-d)}

/* ── CARDS / TABLES ── */
.card{background:var(--white);border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden;margin-bottom:1.25rem}
.card-head{padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.75rem}
.card-title{font-family:var(--head);font-size:17px;font-weight:700;color:var(--dark)}
.card-body{padding:1.5rem}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:10px 14px;text-align:left;font-size:9px;font-weight:600;color:var(--body);text-transform:uppercase;letter-spacing:1.5px;border-bottom:1px solid var(--border);background:var(--cream);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--border);color:var(--dark);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--cream)}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:500;letter-spacing:0.3px;white-space:nowrap}
.badge-green{background:var(--green2);color:#1a6b3a}
.badge-red{background:var(--red2);color:var(--red)}
.badge-gold{background:#fef3e2;color:#c2760a}
.badge-sage{background:var(--teal-l);color:var(--teal-d)}

/* ── BUTTONS ── */
.btn-sm{padding:6px 14px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:0.3px;transition:all 0.2s;cursor:pointer}
.btn-edit{background:var(--cream2);color:var(--teal-d);border:1px solid var(--border)}
.btn-edit:hover{background:var(--teal-l);border-color:var(--teal)}
.btn-del{background:var(--red2);color:var(--red);border:1px solid rgba(192,57,43,0.2)}
.btn-del:hover{background:var(--red);color:white}
.btn-save{background:var(--teal);color:white;border:none;padding:11px 28px;border-radius:30px;font-size:12px;font-weight:600;letter-spacing:0.5px;transition:all 0.2s}
.btn-save:hover{background:var(--teal-d)}
.btn-cancel{background:transparent;color:var(--body);border:1px solid var(--border);padding:11px 24px;border-radius:30px;font-size:12px;font-weight:500;transition:all 0.2s}
.btn-cancel:hover{border-color:var(--dark);color:var(--dark)}

/* ── FORM ── */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:1rem}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:10px;font-weight:600;color:var(--body);text-transform:uppercase;letter-spacing:1px}
.fg input,.fg select,.fg textarea{padding:10px 14px;border:1px solid var(--border2);border-radius:8px;font-size:13.5px;color:var(--dark);background:var(--cream);outline:none;transition:border-color 0.2s;font-weight:400}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--teal);background:var(--white)}
.fg input[readonly]{background:#ececec;color:var(--body);cursor:not-allowed}
.fg textarea{resize:vertical;min-height:80px;line-height:1.6}
.fg.full{grid-column:1/-1}
.fg .hint{font-size:10px;color:var(--body);margin-top:2px}
.form-actions{display:flex;gap:10px;margin-top:1.25rem;flex-wrap:wrap}
.ts-active-bar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--off,#f7f7f5);border:1px solid var(--border2);border-radius:10px}
.ts-active-label{font-size:11px;font-weight:700;color:var(--teal-d,var(--teal));white-space:nowrap}
.ts-active-select{padding:6px 10px;border:1px solid var(--border2);border-radius:6px;font-size:12px;color:var(--dark);background:var(--white);outline:none;max-width:150px}
.rt-toolbar-row{display:flex;align-items:stretch;gap:0}
.rt-toolbar-row>div{flex:1;border-radius:8px 0 0 0}
.rt-toolbar-row .ts-active-select{border-radius:0;max-width:150px;margin:0;border-left:none}
.rt-toolbar-row .ts-active-select:last-child{border-radius:0 8px 0 0}
.ql-toolbar .ts-active-select{vertical-align:middle;max-width:170px;margin:2px 0}
.ts-status{margin-top:-8px;font-size:10.5px;color:var(--body);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ts-status strong{color:var(--teal-d,var(--teal))}
.toggle-wrap{display:flex;align-items:center;gap:10px}
.toggle{width:40px;height:22px;border-radius:11px;background:var(--border2);position:relative;cursor:pointer;transition:background 0.2s;flex-shrink:0;border:none}
.toggle.on{background:var(--teal)}
.toggle::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:white;top:3px;left:3px;transition:left 0.2s;box-shadow:0 1px 4px rgba(0,0,0,0.2)}
.toggle.on::after{left:21px}
.toggle-label{font-size:13px;color:var(--dark);font-weight:400}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;z-index:2000;background:rgba(15,25,18,0.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:1.5rem}
.modal-overlay.open{display:flex}
.modal{background:var(--white);border-radius:var(--r);width:100%;max-width:720px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-md)}
.modal-head{padding:1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--white);z-index:5}
.modal-title{font-family:var(--head);font-size:22px;font-weight:700;color:var(--dark)}
.modal-close{width:32px;height:32px;border-radius:50%;background:var(--cream2);border:1px solid var(--border);color:var(--body);font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;flex-shrink:0}
.modal-close:hover{background:var(--red);color:white;border-color:var(--red)}
.modal-body{padding:1.5rem}

/* ── STATS BAR ── */
.stats-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:1.25rem 1.5rem;box-shadow:var(--shadow)}
.stat-val{font-family:var(--head);font-size:30px;font-weight:700;color:var(--teal-d);line-height:1}
.stat-lbl{font-size:11px;color:var(--body);margin-top:5px;letter-spacing:0.2px}

/* ── BLOG EDITOR ── */
.ql-container{border-radius:0 0 8px 8px;border-color:var(--border2) !important;background:var(--cream);font-family:'Poppins',sans-serif !important;font-size:14px !important}
.ql-toolbar{border-radius:8px 8px 0 0;border-color:var(--border2) !important;background:var(--cream2)}
.ql-editor{min-height:260px;font-family:'Poppins',sans-serif;font-size:14px;line-height:1.75;color:var(--dark)}

/* ── EMPTY / LOADING ── */
.empty{text-align:center;padding:3rem;color:var(--body)}
.empty-icon{font-size:36px;margin-bottom:1rem;opacity:0.5}
.empty-text{font-size:14px}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:2rem;color:var(--body);font-size:13px}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--teal);border-radius:50%;animation:spin 0.7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── IMAGE PREVIEW ── */
.img-preview-lg{width:100%;height:160px;object-fit:cover;border-radius:8px;border:1px solid var(--border);margin-top:8px;display:none}

/* ── TABS ── */
.sub-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:1.5rem}
.sub-tab{padding:10px 20px;font-size:12px;font-weight:500;color:var(--body);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.2s;letter-spacing:0.2px}
.sub-tab.active{color:var(--teal-d);border-bottom-color:var(--teal);font-weight:600}
.sub-tab:hover{color:var(--teal-d)}
.sub-pane{display:none}
.sub-pane.active{display:block}

/* ── IMAGE UPLOAD ── */
.upload-box{border:2px dashed var(--border2);border-radius:10px;padding:1.25rem;text-align:center;cursor:pointer;transition:all 0.25s;background:var(--cream);position:relative}
.upload-box:hover{border-color:var(--teal);background:var(--teal-l)}
.upload-box input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.upload-box-icon{font-size:24px;margin-bottom:6px}
.upload-box-text{font-size:12px;color:var(--body)}
.upload-box-text strong{color:var(--teal-d);font-weight:600}
.upload-progress{display:none;margin-top:8px;background:var(--cream2);border-radius:20px;overflow:hidden;height:4px}
.upload-progress-bar{height:100%;background:linear-gradient(90deg,var(--teal),var(--coral));border-radius:20px;transition:width 0.3s;width:0%}
.upload-status{font-size:11px;color:var(--body);margin-top:6px;display:none;text-align:center}
.upload-or{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:10px;color:var(--body);text-transform:uppercase;letter-spacing:1px}
.upload-or::before,.upload-or::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── NESTED ROW LISTS ── */
.nrow{border:1px solid var(--border);border-radius:8px;padding:1rem;margin-bottom:0.75rem;background:var(--cream)}
.nrow-label{font-size:10px;color:var(--body);text-transform:uppercase;letter-spacing:1.5px;font-weight:600}
.nrow input,.nrow textarea,.nrow select{padding:8px 12px;border:1px solid var(--border2);border-radius:6px;font-size:12.5px;width:100%;background:white;margin-bottom:6px}

/* ── QUICK TOGGLE LIST (Featured Tribe Trips) ── */
.qt-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border)}
.qt-row:last-child{border-bottom:none}
.qt-img{width:44px;height:34px;border-radius:5px;object-fit:cover;flex-shrink:0;background:var(--cream2)}
.qt-name{flex:1;font-size:13px;color:var(--dark)}
.qt-meta{font-size:11px;color:var(--body)}

@media(max-width:768px){.sidebar{width:210px}.stats-bar{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.sidebar{display:none}.content{padding:1rem}}
</style>
</head>
<body>

<div class="app">

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-name">Eureka Trips</div>
    <div class="sidebar-logo-sub">Admin Panel</div>
  </div>
  <div class="sidebar-badge">
    <div class="sidebar-badge-dot"></div>
    <span>Connected to Supabase</span>
  </div>
  <nav class="sidebar-nav" id="sidebarNav"></nav>
  <div class="sidebar-footer">
    <a href="index.html" target="_blank">🌐 &nbsp; View Website</a>
  </div>
</aside>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div class="topbar-title-wrap">
      <div class="topbar-crumb" id="topbarCrumb">Home Page</div>
      <div class="topbar-title" id="topbarTitle">Page Settings</div>
    </div>
    <div class="topbar-right">
      <div class="ts-active-bar" title="Whatever you type and save anywhere in the admin panel while these are selected gets tagged with these styles.">
        <span class="ts-active-label">🔤 Typography now:</span>
        <select id="activeTsDesktop" class="ts-active-select" onchange="setActiveTypography('desktop', this.value)"><option value="">Desktop: Default</option></select>
        <select id="activeTsMobile" class="ts-active-select" onchange="setActiveTypography('mobile', this.value)"><option value="">Mobile: Default</option></select>
      </div>
      <button class="btn-add" id="topbarAddBtn" onclick="openAddModal()">+ Add New</button>
    </div>
  </div>
  <div class="content" id="mainContent">
    <div class="loading"><div class="spinner"></div> Loading...</div>
  </div>
</div>

</div><!-- /app -->

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">Add Item</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────
var SB_URL = 'https://caigrloiymgfxubzprbg.supabase.co/rest/v1';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhaWdybG9peW1nZnh1YnpwcmJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzOTM1MjksImV4cCI6MjA5ODk2OTUyOX0.zA5Q1kAAk66fgX_Ertnrbb4TJmM5yPE71zy-alK-yqE';
var STORAGE_URL = 'https://caigrloiymgfxubzprbg.supabase.co/storage/v1';
var BUCKET = 'eureka-images';

// ── API HELPERS ───────────────────────────────────────────────
async function sbFetch(table, params) {
  params = params || '';
  var r = await fetch(SB_URL + '/' + table + '?' + params, { headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY } });
  var data = await r.json();
  if (!r.ok) { console.error('Supabase fetch error [' + table + ']', data); return []; }
  return data;
}
async function sbInsert(table, data) {
  var r = await fetch(SB_URL + '/' + table, { method: 'POST', headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' }, body: JSON.stringify(data) });
  var result = await r.json();
  if (!r.ok) { console.error('Supabase insert error [' + table + ']', result); throw new Error(result.message || 'Insert failed'); }
  return result;
}
async function sbUpdate(table, id, data, idCol) {
  idCol = idCol || 'id';
  var r = await fetch(SB_URL + '/' + table + '?' + idCol + '=eq.' + id, { method: 'PATCH', headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' }, body: JSON.stringify(data) });
  var result = await r.json();
  if (!r.ok) { console.error('Supabase update error [' + table + ']', result); throw new Error(result.message || 'Update failed'); }
  return result;
}
async function sbDelete(table, id, idCol) {
  idCol = idCol || 'id';
  var r = await fetch(SB_URL + '/' + table + '?' + idCol + '=eq.' + id, { method: 'DELETE', headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY } });
  if (!r.ok) { var result = await r.json().catch(function(){return {};}); console.error('Supabase delete error [' + table + ']', result); throw new Error(result.message || 'Delete failed'); }
}
async function sbUpsert(table, data, onConflict) {
  var url = SB_URL + '/' + table;
  if (onConflict) url += '?on_conflict=' + onConflict;
  var r = await fetch(url, { method: 'POST', headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates,return=representation' }, body: JSON.stringify(data) });
  var result = await r.json();
  if (!r.ok) { console.error('Supabase upsert error [' + table + ']', result); throw new Error(result.message || 'Save failed'); }
  return result;
}

// ── IMAGE UPLOAD ──────────────────────────────────────────────
async function uploadImage(file, targetInputId, previewId, progressId, statusId) {
  if (!file) return;
  if (!file.type.startsWith('image/')) { toast('Please select an image file', 'error'); return; }
  if (file.size > 5 * 1024 * 1024) { toast('Image must be under 5MB', 'error'); return; }
  var prog = document.getElementById(progressId);
  var status = document.getElementById(statusId);
  if (prog) { prog.style.display = 'block'; prog.querySelector('.upload-progress-bar').style.width = '30%'; }
  if (status) { status.style.display = 'block'; status.textContent = 'Uploading...'; }
  try {
    var ext = file.name.split('.').pop().toLowerCase();
    var filename = Date.now() + '-' + Math.random().toString(36).substr(2,6) + '.' + ext;
    var r = await fetch(STORAGE_URL + '/object/' + BUCKET + '/' + filename, {
      method: 'POST', headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': file.type, 'x-upsert': 'true' }, body: file
    });

async function saveTypographyStyle(id, scope) {
  var data = {
    scope: scope, name: val('tsm_name'),
    font_family: val('tsm_family'), font_size: Number(val('tsm_size'))||null,
    font_weight: Number(val('tsm_weight'))||null, line_height: Number(val('tsm_lh'))||null,

      pane.classList.add('active');
      document.querySelectorAll('.sub-tab').forEach(function(b){
        var oc = b.getAttribute('onclick');
        if (oc && oc.indexOf("'"+lastActiveSubTab+"'") !== -1) b.classList.add('active');
      });
    }
  }
}

}

  document.getElementById('modalOverlay').classList.remove('open');

}

function showTab(tabId) {
  currentTab = tabId;
  var cfg = TAB_CONFIG[tabId];
  document.querySelectorAll('.nav-item').forEach(function(el){ el.classList.remove('active'); });
  var el = document.querySelector('.nav-item[data-tab="'+tabId+'"]');
  if (el) el.classList.add('active');
  document.getElementById('topbarCrumb').textContent = cfg.crumb;
  document.getElementById('topbarTitle').textContent = cfg.title;
  document.getElementById('topbarAddBtn').style.display = cfg.add ? 'flex' : 'none';
  cfg.load();
}

  if (cfg && cfg.addFn) cfg.addFn();
}

async function loadTrips() {
  setLoading();
  var rows = await sbFetch('trips', 'order=sort_order.asc');
  if (!Array.isArray(rows)) { console.error('trips fetch error:', rows); rows = []; }
  var html = pageHint('These trips power the homepage carousel and each trip\'s own detail page (trip-page.html).') +
    '<div class="stats-bar">' +
    '<div class="stat-card"><div class="stat-val">' + rows.length + '</div><div class="stat-lbl">Total Trips</div></div>' +
    '<div class="stat-card"><div class="stat-val">' + rows.filter(function(r){return r.hot}).length + '</div><div class="stat-lbl">Marked Hot</div></div>' +
    '<div class="stat-card"><div class="stat-val">' + rows.filter(function(r){return r.active}).length + '</div><div class="stat-lbl">Active</div></div>' +
    '</div>';
  if (rows.length === 0) {
    html += '<div class="card"><div class="card-body"><div class="empty"><div class="empty-icon">🧳</div><div class="empty-text">No trips yet. Click "+ Add New" to get started.</div></div></div></div>';
  } else {
    html += '<div class="card"><div class="table-wrap"><table><thead><tr><th>Trip Name</th><th>Type</th><th>Price</th><th>Tags</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
    rows.forEach(function(r) {
      html += '<tr>' +
        '<td><strong>' + esc(r.name) + '</strong></td>' +
        '<td>' + esc(r.trip_type||'—') + '</td>' +
        '<td>₹' + (r.price||0).toLocaleString() + '</td>' +
        '<td>' + (r.tags||[]).map(function(t){return '<span class="badge badge-sage">'+esc(t)+'</span>'}).join(' ') + '</td>' +
        '<td>' + (r.hot ? '<span class="badge badge-gold">Hot</span> ' : '') + '<span class="badge ' + (r.active?'badge-green':'badge-red') + '">' + (r.active?'Active':'Hidden') + '</span></td>' +
        '<td><div style="display:flex;gap:6px">' +
          '<button class="btn-sm btn-edit" onclick="editTrip(\'' + r.id + '\')">Edit</button>' +
          '<button class="btn-sm btn-del" onclick="deleteItem(\'trips\',\'' + r.id + '\',loadTrips)">Delete</button>' +
        '</div></td></tr>';
    });
    html += '</tbody></table></div></div>';
  }
  document.getElementById('mainContent').innerHTML = html;
}
async function editTrip(id) {
  var rows = await sbFetch('trips', 'id=eq.' + id);
  var r = rows[0];
  editingId = id;
  await ensureTypographyStylesLoaded();
  var results = await Promise.all([
    sbFetch('trip_itinerary', 'trip_id=eq.' + id + '&order=sort_order'),
    sbFetch('trip_reviews', 'trip_id=eq.' + id + '&order=sort_order'),
    sbFetch('settings', '')
  ]);
  var settingsMap = {};
  (Array.isArray(results[2]) ? results[2] : []).forEach(function(row){ settingsMap[row.key] = row.value; });
  TP_SETTINGS_MAP = settingsMap;
  CURRENT_ADMIN_SETTINGS = settingsMap;
  renderTripEditorPage(r, Array.isArray(results[0])?results[0]:[], Array.isArray(results[1])?results[1]:[]);
}

async function saveTrip(oldId) {
  var id = oldId ? val('tp_id') : slugify(val('tp_id'));
  if (!id) { toast('Trip ID is required', 'error'); return; }
  var accomPhotos = [];
  document.querySelectorAll('#tpAccomPicsList input').forEach(function(inp) {
    if (/^tp_ap_\d+$/.test(inp.id)) { var v = inp.value.trim(); if (v) accomPhotos.push(v); }
  });
  var data = {
    id: id, name: val('tp_name'), trip_type: val('tp_type'), price: Number(val('tp_price'))||0,
    duration: val('tp_duration'), route: val('tp_route'), page_slug: val('tp_slug'),
    dates: csv(val('tp_dates')), tags: csv(val('tp_tags')), region: val('tp_region'), destination_slug: val('tp_destslug'), detail_title: val('tp_dtitle'), overview: rval('tp_overview'),
    joy1_icon: val('tp_joy1icon'), joy1_label: val('tp_joy1label'), joy1_percent: Number(val('tp_joy1pct'))||0,
    joy2_icon: val('tp_joy2icon'), joy2_label: val('tp_joy2label'), joy2_percent: Number(val('tp_joy2pct'))||0,
    joy3_icon: val('tp_joy3icon'), joy3_label: val('tp_joy3label'), joy3_percent: Number(val('tp_joy3pct'))||0,
    joy4_icon: val('tp_joy4icon'), joy4_label: val('tp_joy4label'), joy4_percent: Number(val('tp_joy4pct'))||0,
    inclusions: lines(val('tp_incl')), exclusions: lines(val('tp_excl')),
    accommodation_text: rval('tp_accomtext'), accommodation_list: lines(val('tp_accomlist')),
    image_url: val('tp_img'), gallery_images: accomPhotos,
    hot: document.getElementById('tp_hot').classList.contains('on'),
    active: document.getElementById('tp_active').classList.contains('on')
  };
  try {
    if (oldId) {
      if (oldId !== id) { toast('Trip ID cannot be changed after creation', 'error'); return; }
      await sbUpdate('trips', id, data);
    } else { await sbInsert('trips', data); }
    stampSharedTypography('tp_title', data.name, TP_EDITOR_SNAPSHOT.name);
    stampSharedTypography('tp_route', data.route, TP_EDITOR_SNAPSHOT.route);
    stampSharedTypography('tp_joy_label', data.joy1_label, TP_EDITOR_SNAPSHOT.joy1_label);
    stampSharedTypography('tp_joy_label', data.joy2_label, TP_EDITOR_SNAPSHOT.joy2_label);
    stampSharedTypography('tp_joy_label', data.joy3_label, TP_EDITOR_SNAPSHOT.joy3_label);
    stampSharedTypography('tp_joy_label', data.joy4_label, TP_EDITOR_SNAPSHOT.joy4_label);
    stampSharedTypography('tp_detail_title', data.detail_title, TP_EDITOR_SNAPSHOT.detail_title);
    stampSharedTypography('tp_detail_desc', data.overview, TP_EDITOR_SNAPSHOT.overview);
    stampSharedTypography('tp_accom_text', data.accommodation_text, TP_EDITOR_SNAPSHOT.accommodation_text);
    toast('Trip saved!', 'success');
    editingId = id; editTrip(id);
  } catch(e) { toast('Error saving trip', 'error'); console.error(e); }
}

async function moveAdBanner(id, dir) {
  var rows = await sbFetch('ad_banners', 'order=sort_order.asc');
  if (!Array.isArray(rows)) return;
  var idx = rows.findIndex(function(r){ return r.id === id; });
  var swapIdx = idx + dir;
  if (swapIdx < 0 || swapIdx >= rows.length) return;
  var a = rows[idx], b = rows[swapIdx];
  try {
    await Promise.all([
      sbUpdate('ad_banners', a.id, { sort_order: b.sort_order }),
      sbUpdate('ad_banners', b.id, { sort_order: a.sort_order })
    ]);
    loadAdBanners();
  } catch(e) { toast('Error reordering', 'error'); }
}

async function saveBlog(oldSlug) {
  var slug = val('bp_slug');
  if (!slug) { toast('Slug is required', 'error'); return; }
  var badges = [];
  if (val('bp_b1_text')) { var b1 = { type: val('bp_b1_type'), text: val('bp_b1_text') }; if (b1.type === 'solid') b1.color = val('bp_b1_color'); badges.push(b1); }
  if (val('bp_b2_text')) { var b2 = { type: val('bp_b2_type'), text: val('bp_b2_text') }; if (b2.type === 'solid') b2.color = val('bp_b2_color'); badges.push(b2); }
  var data = {
    slug: slug, title: rval('bp_title'), tags: csv(val('bp_tags')), image_url: val('bp_img'),
    image_alt: val('bp_alt'), excerpt: val('bp_excerpt'), badges: badges,
    article_html: quillEditor ? quillEditor.root.innerHTML : '',
    active: document.getElementById('bp_active').classList.contains('on'),
    featured_home: document.getElementById('bp_featured').classList.contains('on')
  };
  try {
    if (oldSlug) {
      if (oldSlug !== slug) { toast('Slug cannot be changed after creation', 'error'); return; }
      await sbUpdate('blog_posts', slug, data, 'slug');
    } else { await sbInsert('blog_posts', data); }
    toast('Blog post saved!', 'success'); closeModal(); loadBlog();
  } catch(e) { toast('Error saving blog post', 'error'); console.error(e); }
}

async function saveDestGuide(oldId) {
  var id = val('dg_id');
  if (!id) { toast('Destination ID is required', 'error'); return; }
  var data = {
    id: id, name: val('dg_name'), country: val('dg_country'), image_url: val('dg_img'), image_alt: val('dg_imgalt'),
    dg_category: val('dg_catname'), dg_subtitle: val('dg_catsub'), dg_meta: val('dg_catmeta'), short_desc: val('dg_short'),
    guide_content: rval('dg_guide'),
    has_guide: document.getElementById('dg_hasguide').classList.contains('on'),
    active: document.getElementById('dg_active').classList.contains('on')
  };
  try {
    if (oldId) {
      if (oldId !== id) { toast('Destination ID cannot be changed after creation', 'error'); return; }
      await sbUpdate('destinations', id, data);
    } else { await sbInsert('destinations', data); }
    toast('Destination guide saved!', 'success');
    editDestGuide(id);
  } catch(e) { toast('Error saving destination guide', 'error'); console.error(e); }
}

  if (health === null) return '<div class="page-hint" style="background:#f4f6f5;border-color:var(--border2);color:var(--body)">Couldn\'t check ' + esc(pageFile) + '\'s mobile typography engine (fetch failed).</div>';
  if (health.ok) return '<div class="page-hint" style="background:#eafaf3;border-color:#a7e8c8;color:#1a6b3a">✓ ' + esc(pageFile) + ' is running the current mobile typography engine — line height and alignment (including on icon/tag-style flex layouts) are able to work correctly here, for every field below.</div>';
  var missing = [];
  if (!health.hasFlexAlignFix) missing.push('flex-layout alignment');
  if (!health.hasLineHeightInSelection) missing.push('highlighted-text line-height/alignment');
  return '<div class="page-hint" style="background:#fef2f2;border-color:#fecaca;color:#b91c1c;font-weight:600">⚠️ ' + esc(pageFile) + ' appears to be running an OLDER version missing: ' + esc(missing.join(', ')) + '. Every field below may look correctly wired and still not reflect mobile changes, until this page is redeployed with the current file. This is a deployment issue, not a setting to fix here.</div>';
}
// ── PER-ITEM (highlight-text) SCREENS ──────────────────────────────
// These screens (Hero Stats, Featured Trips, Ad Banners, Review Cards, Stats
// Grid, Reason Cards) don't have a fixed data-ts tag per field — instead, the
// per-item text is rendered via stripOuterParagraph(row.FIELD) on the live page,
// which preserves whatever tsd-X/tsm-X classes Quill embedded when a highlight
// was styled. So "is this wired" here means: does that exact rendering call
// still exist on the live page — verified per screen, not per individual row,
// since every row of the same type shares the same render code.
var MODAL_TYPOGRAPHY_CHECKS = {
  'home-herostats':   { pageFile:'index.html', label:'Hero Stats Row', patterns:[{field:'Label', pattern:'stripOuterParagraph(r.label'}] },
  'home-featuredtrips': { pageFile:'index.html', label:'Featured Trips Slider', patterns:[{field:'Eyebrow / Heading / Description', pattern:"setText('ftEyebrow', r.eyebrow"}] },
  'home-adbanners':   { pageFile:'index.html', label:'Ad Banners', patterns:[{field:'Title', pattern:'stripOuterParagraph(r.title'},{field:'Subtitle', pattern:'stripOuterParagraph(r.subtitle'}] },
  'home-reviews':     { pageFile:'index.html', label:'Review Cards', patterns:[{field:'Name', pattern:'stripOuterParagraph(r.name'},{field:'Ago Label', pattern:'stripOuterParagraph(r.ago'},{field:'Quote', pattern:'stripOuterParagraph(r.q'}] },
  'home-stats':       { pageFile:'index.html', label:'Stats Grid', patterns:[{field:'Number / Description', pattern:'stripOuterParagraph(r.number_label'}] },
  'home-why':         { pageFile:'index.html', label:'Reason Cards', patterns:[{field:'Title / Description', pattern:'stripOuterParagraph(r.title'}] }
};
// Renders the same style of confirmation banner as mobileEngineBanner, but for
// a MODAL_TYPOGRAPHY_CHECKS screen — checked once per screen, shown once at the
// top of the list (not per row, since every row shares the same render code).
function modalWiringBanner(tabId, sourceHtml) {
  var check = MODAL_TYPOGRAPHY_CHECKS[tabId];
  if (!check) return '';
  if (sourceHtml == null) return '<div class="page-hint" style="background:#f4f6f5;border-color:var(--border2);color:var(--body)">Couldn\'t verify ' + esc(check.label) + ' against ' + esc(check.pageFile) + ' (fetch failed).</div>';
  var missing = check.patterns.filter(function(p){ return sourceHtml.indexOf(p.pattern) === -1; });
  if (missing.length === 0) return '<div class="page-hint" style="background:#eafaf3;border-color:#a7e8c8;color:#1a6b3a">✓ Confirmed wired — every field here (' + esc(check.patterns.map(function(p){return p.field;}).join(', ')) + ') is found rendering correctly on the live ' + esc(check.pageFile) + ' right now. Style a highlighted selection here and it will show on both Desktop and Mobile.</div>';
  return '<div class="page-hint" style="background:#fef2f2;border-color:#fecaca;color:#b91c1c;font-weight:700">⚠️ NOT FULLY WIRED — ' + esc(missing.map(function(p){return p.field;}).join(', ')) + ' not found rendering on the live ' + esc(check.pageFile) + ' right now. Typography chosen for ' + (missing.length===check.patterns.length?'this section':'these fields') + ' will not appear on the live page. This needs a developer fix, not a re-save.</div>';
}
// Fetches and holds the source for whichever page the currently-open admin screen
// belongs to, so wiringConfirmationLine() above can be called synchronously many
// times per screen without re-fetching for every single field.
var CURRENT_PAGE_SOURCE = null;
var CURRENT_PAGE_FILE = null;
async function loadPageSourceFor(pageFile) {
  CURRENT_PAGE_FILE = pageFile;
  CURRENT_PAGE_SOURCE = pageFile ? await fetchFrontendSource(pageFile) : null;
}
var TEXT_FIELD_TYPES = ['text', 'textarea', 'richtext'];
var GT_EDITOR_SNAPSHOT = {}; // set by renderGroupTripEditorPage; used below to detect real per-trip field changes
var TP_EDITOR_SNAPSHOT = {}; // set by renderTripEditorPage; same purpose for Private Trip Pages
var TP_SETTINGS_MAP = {}; // set by editTrip; typography style ids currently assigned to each shared tp_* key
async function addNewTrip() {
  var rows = await sbFetch('settings', '');
  var settingsMap = {};
  (Array.isArray(rows) ? rows : []).forEach(function(row){ settingsMap[row.key] = row.value; });
  TP_SETTINGS_MAP = settingsMap;
  renderTripEditorPage(null, [], []);
}
// Same "🔤 Desktop: X · Mobile: Y [Clear style]" status line as Group Trip's editor, for the Private Trip editor
function tpTsStatus(key) {
  var dName = tsStyleName('desktop', TP_SETTINGS_MAP[key + '_style_desktop']);
  var mName = tsStyleName('mobile', TP_SETTINGS_MAP[key + '_style_mobile']);
  return '<div class="ts-status">🔤 Desktop: <strong>' + esc(dName) + '</strong>' + tsWarnIfEmpty('desktop', TP_SETTINGS_MAP[key+'_style_desktop']) + ' &nbsp;·&nbsp; Mobile: <strong>' + esc(mName) + '</strong>' + tsWarnIfEmpty('mobile', TP_SETTINGS_MAP[key+'_style_mobile']) +
    ' <button type="button" class="btn-sm btn-edit" onclick="applyActiveStyleToFieldTP(\''+key+'\',\'desktop\')">Apply Desktop pen</button>' +
    ' <button type="button" class="btn-sm btn-edit" onclick="applyActiveStyleToFieldTP(\''+key+'\',\'mobile\')">Apply Mobile pen</button>' +
    ((TP_SETTINGS_MAP[key+'_style_desktop'] || TP_SETTINGS_MAP[key+'_style_mobile']) ? ' <button type="button" class="btn-sm btn-del" onclick="clearFieldTypographyTP(\''+key+'\')">Clear style</button>' : '') +
    '</div>';
}
async function applyActiveStyleToFieldTP(key, scope) {
  try {
    if (scope) {
      await sbUpsert('settings', { key: key + '_style_' + scope, value: ACTIVE_TS[scope] || '' }, 'key');
      toast((scope === 'desktop' ? 'Desktop' : 'Mobile') + ' style applied to this field — the other scope was left untouched.', 'success');
    } else {
      await Promise.all([
        sbUpsert('settings', { key: key + '_style_desktop', value: ACTIVE_TS.desktop || '' }, 'key'),
        sbUpsert('settings', { key: key + '_style_mobile', value: ACTIVE_TS.mobile || '' }, 'key')
      ]);
      toast('Typography applied — pick "Typography now" above first if you meant a different style.', 'success');
    }
    if (editingId) editTrip(editingId); else addNewTrip();
  } catch(e) { toast('Error applying style', 'error'); }
}
async function clearFieldTypographyTP(key) {
  try {
    await Promise.all([
      sbUpsert('settings', { key: key + '_style_desktop', value: '' }, 'key'),
      sbUpsert('settings', { key: key + '_style_mobile', value: '' }, 'key')
    ]);
    toast('Style cleared — this is back to Default everywhere it\'s used.', 'success');
    if (editingId) editTrip(editingId); else addNewTrip();
  } catch(e) { toast('Error clearing style', 'error'); }
}
var GT_DAY_SNAPSHOTS = {}; // set by renderGroupTripEditorPage; per-day baseline, keyed by itinerary row id
var GT_DATE_SNAPSHOTS = {}; // set by renderGroupTripEditorPage; per-date baseline, keyed by date row id
var GT_SETTINGS_MAP = {}; // set by renderGroupTripEditorPage; typography style ids currently assigned to each shared gt_* key
// Same "🔤 Desktop: X · Mobile: Y [Clear style]" status line as the normal settings
// screens, adapted for the trip editor (which isn't a renderSettingsGroup screen).
function gtTsStatus(key) {
  var dName = tsStyleName('desktop', GT_SETTINGS_MAP[key + '_style_desktop']);
  var mName = tsStyleName('mobile', GT_SETTINGS_MAP[key + '_style_mobile']);
  return '<div class="ts-status">🔤 Desktop: <strong>' + esc(dName) + '</strong>' + tsWarnIfEmpty('desktop', GT_SETTINGS_MAP[key+'_style_desktop']) + ' &nbsp;·&nbsp; Mobile: <strong>' + esc(mName) + '</strong>' + tsWarnIfEmpty('mobile', GT_SETTINGS_MAP[key+'_style_mobile']) +
    ' <button type="button" class="btn-sm btn-edit" onclick="applyActiveStyleToFieldGT(\''+key+'\',\'desktop\')">Apply Desktop pen</button>' +
    ' <button type="button" class="btn-sm btn-edit" onclick="applyActiveStyleToFieldGT(\''+key+'\',\'mobile\')">Apply Mobile pen</button>' +
    ((GT_SETTINGS_MAP[key+'_style_desktop'] || GT_SETTINGS_MAP[key+'_style_mobile']) ? ' <button type="button" class="btn-sm btn-del" onclick="clearFieldTypographyGT(\''+key+'\')">Clear style</button>' : '') +
    '</div>';
}
async function applyActiveStyleToFieldGT(key, scope) {
  try {
    if (scope) {
      await sbUpsert('settings', { key: key + '_style_' + scope, value: ACTIVE_TS[scope] || '' }, 'key');
      toast((scope === 'desktop' ? 'Desktop' : 'Mobile') + ' style applied to this field — the other scope was left untouched.', 'success');
    } else {
      await Promise.all([
        sbUpsert('settings', { key: key + '_style_desktop', value: ACTIVE_TS.desktop || '' }, 'key'),
        sbUpsert('settings', { key: key + '_style_mobile', value: ACTIVE_TS.mobile || '' }, 'key')
      ]);
      toast('Typography applied — pick "Typography now" above first if you meant a different style.', 'success');
    }
    if (editingId) editGroupTrip(editingId); else addNewGroupTrip();
  } catch(e) { toast('Error applying style', 'error'); }
}
async function clearFieldTypographyGT(key) {
  try {
    await Promise.all([
      sbUpsert('settings', { key: key + '_style_desktop', value: '' }, 'key'),
      sbUpsert('settings', { key: key + '_style_mobile', value: '' }, 'key')
    ]);
    toast('Style cleared — this is back to Default everywhere it\'s used.', 'success');
    if (editingId) editGroupTrip(editingId); else addNewGroupTrip();
  } catch(e) { toast('Error clearing style', 'error'); }
}
// Stamps a GLOBAL typography key (e.g. gt_title) with the currently active style,
// but only if the given field's value actually changed from the trip's original —
// same "only stamp what you actually touched" rule as the rest of the site. Since
// the style is shared across every trip's title/etc, this keeps ALL trips visually
// consistent no matter which individual trip you happened to edit it from.
async function stampSharedTypography(key, newVal, oldVal) {
  if (newVal === (oldVal || '')) return;
  try {
    var pairs = [];
    if (!CURRENT_ADMIN_SETTINGS[key + '_style_desktop']) pairs.push(sbUpsert('settings', { key: key + '_style_desktop', value: ACTIVE_TS.desktop || '' }, 'key'));
    if (!CURRENT_ADMIN_SETTINGS[key + '_style_mobile'])  pairs.push(sbUpsert('settings', { key: key + '_style_mobile', value: ACTIVE_TS.mobile || '' }, 'key'));
    await Promise.all(pairs);
  } catch(e) { /* non-fatal — the trip content itself still saved fine */ }
}
function readFieldValueFromDom(f) {
  if (f.type === 'richtext') return rval('set_'+f.key);
  if (f.type === 'imagelist') {
    var container = document.getElementById('setimglist_' + f.key);
    var urls = [];
    if (container) {
      container.querySelectorAll('input[type="text"]').forEach(function(inp) {
        var v = inp.value.trim();
        if (v) urls.push(v);
      });
    }
    return JSON.stringify(urls);
  }
  return val('set_'+f.key);
}
async function saveSettingsGroup(group) {
  var fields = SETTINGS_GROUPS[group];
  var before = SETTINGS_SNAPSHOT[group] || {};
  var pairs = [];
  fields.forEach(function(f) {
    if (f.type === 'typography_only') return; // has its own Apply/Clear buttons, not part of the normal save
    var newVal = readFieldValueFromDom(f);
    pairs.push([f.key, newVal]);

    // Auto-tag with whatever Typography style is currently active at the top of the
    // admin panel — but ONLY when this field doesn't already have its own style
    // chosen (still on Default), and only when its content actually changed just
    // now. The active pen is global and stays selected across completely unrelated
    // saves — auto-stamping a field that already has a deliberately-picked style
    // would silently overwrite it with whatever the pen happens to be at the
    // moment, just because someone fixed a typo elsewhere on the same screen. A
    // field that's still on Default has nothing to lose by picking up the pen;
    // once it has its own style, only the explicit Apply/Clear buttons touch it.
    if (TEXT_FIELD_TYPES.indexOf(f.type) !== -1 && newVal !== (before[f.key] || '')) {
      if (!CURRENT_ADMIN_SETTINGS[f.key + '_style_desktop']) pairs.push([f.key + '_style_desktop', ACTIVE_TS.desktop || '']);
      if (!CURRENT_ADMIN_SETTINGS[f.key + '_style_mobile'])  pairs.push([f.key + '_style_mobile', ACTIVE_TS.mobile || '']);
    }
  });
  try {
    await Promise.all(pairs.map(function(p){ return sbUpsert('settings', { key: p[0], value: p[1] }, 'key'); }));
    toast('Settings saved!', 'success');
  } catch(e) { toast('Error saving settings', 'error'); }
}

// ── INIT ──────────────────────────────────────────────────────
buildSidebar();
initActiveTypographyBar();
showTab('home-settings');
</script>
